
name: Android APK Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter tests
        run: flutter test --coverage

  build-apk:
    name: Build APK - ${{ matrix.flavor }}
    needs: validate

    # Do not expose production signing secrets to PR builds.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: development
            target: lib/main_development.dart

          - flavor: staging
            target: lib/main_staging.dart

          - flavor: production
            target: lib/main_production.dart

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ]; then
            echo "Missing Android release signing secrets."
            exit 1
          fi

          echo "Android signing secrets are configured."

      - name: Restore Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/orangepos-release.jks

          chmod 600 android/app/orangepos-release.jks

          if [ ! -s android/app/orangepos-release.jks ]; then
            echo "Keystore restoration failed."
            exit 1
          fi

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: orangepos-release.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --flavor "${{ matrix.flavor }}" \
            -t "${{ matrix.target }}"

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist

          APK_PATH="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found: $APK_PATH"
            find build/app/outputs -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK_PATH" \
            "dist/orangepos-${{ matrix.flavor }}-release.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          APK_PATH="dist/orangepos-${{ matrix.flavor }}-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: orangepos-${{ matrix.flavor }}-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing files
        if: always()
        shell: bash
        run: |
          rm -f android/app/orangepos-release.jks
          rm -f android/key.properties
